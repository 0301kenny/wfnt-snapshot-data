name: snapshot

on:
  schedule:
    - cron: '37 9,11,13 * * 1-5'
    - cron: '37 2 * * 6,0'
  workflow_dispatch:
    inputs:
      datasets:
        description: 'Comma-separated dataset keys to run'
        required: false
        type: string
      force:
        description: 'Force overwrite and ignore hash skips'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run snapshot
        id: snapshot
        env:
          SNAPSHOT_DATASETS: ${{ inputs.datasets }}
          SNAPSHOT_FORCE: ${{ inputs.force }}
        run: node scripts/run.mjs

      # data/ is git-ignored (local-only since TICKET-070), so the run output is kept
      # as a build artifact instead of being committed. Replaced by an R2 sync later.
      - name: Upload snapshot output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-${{ github.run_id }}
          path: data/
          retention-days: 7
          if-no-files-found: warn

      - name: Report snapshot summary
        if: always()
        env:
          SUMMARY: ${{ steps.snapshot.outputs.commit_message }}
        run: echo "${SUMMARY:-(no summary produced)}" >> "$GITHUB_STEP_SUMMARY"
